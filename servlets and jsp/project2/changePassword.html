<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .box { width: 320px; border: 1px solid #ccc; padding: 20px; margin: 0 auto; }
        .err { color: red; margin-bottom: 10px; }
    </style>
    <script>
        function validateForm() {
            var newPass = document.getElementById("newPassword").value;
            var rePass = document.getElementById("retypeNewPassword").value;
            if (newPass !== rePass) {
                document.getElementById("err-msg").innerText = "New password and Retyped password must be same!";
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
    <div class="box">
        <h2>Change Password</h2>
        <div id="err-msg" class="err"></div>
        <form action="LoginServlet" method="post" onsubmit="return validateForm()">
            <input type="hidden" name="action" value="changePassword">
            <div>
                <label>User Name:</label><br>
                <input type="text" name="username" required>
            </div><br>
            <div>
                <label>Old Password:</label><br>
                <input type="password" name="oldPassword" required>
            </div><br>
            <div>
                <label>New Password:</label><br>
                <input type="password" id="newPassword" name="newPassword" required>
            </div><br>
            <div>
                <label>Retype New Password:</label><br>
                <input type="password" id="retypeNewPassword" name="retypeNewPassword" required>
            </div><br>
            <input type="submit" value="Submit">
        </form>
    </div>
</body>
</html>
