<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <script>
        function validateLoginForm() {
            let password = document.forms["loginForm"]["password"].value;
            
            // Password validation regex: Min 6 characters, at least 1 uppercase letter, at least 1 number
            let passwordRegex = /^(?=.*[A-Z])(?=.*\d).{6,}$/;

            if (password === "") {
                alert("Password should not be empty.");
                return false;
            }
            if (password.length < 6) {
                alert("Password can't be less than 6 characters.");
                return false;
            }
            if (!passwordRegex.test(password)) {
                alert("Password must contain at least one uppercase letter and one number.");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
    <h2>Login Page</h2>
    <form name="loginForm" action="LoginServlet" method="post" onsubmit="return validateLoginForm()">
        <table cellpadding="5">
            <tr>
                <td>Enter User Name:</td>
                <td><input type="text" name="username" required></td>
            </tr>
            <tr>
                <td>Enter Pass Word:</td>
                <td><input type="password" name="password" required></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="submit"></td>
            </tr>
            <tr>
                <td></td>
                <td><a href="registration.html">New User</a></td>
            </tr>
        </table>
    </form>
</body>
</html>
