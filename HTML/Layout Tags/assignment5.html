<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 5 - Page Navigation Links</title>
</head>
<body>

    <!-- Anchor at top -->
    <div id="top"></div>
    
    <h2>Top of the Page</h2>
    <!-- Link to scroll down to #bottom -->
    <a href="#bottom">Go to Bottom</a>

    <!-- Filler height to create vertical scroll bar -->
    <div style="height: 1000px; padding-top: 50px;">
        <p><em>Content section (Scroll space)</em></p>
    </div>

    <!-- Anchor at bottom -->
    <div id="bottom"></div>
    
    <h2>Bottom of the Page</h2>
    <!-- Link to scroll back up to #top -->
    <a href="#top">Go to Top</a>

</body>
</html>
