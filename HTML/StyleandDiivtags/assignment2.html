<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Div Tags - Assignment 2</title>
</head>
<body>

    <!-- First Form Container -->
    <div id="visitor-info-section">
        <h1>Visitors information</h1>
        <hr>
        <form>
            <table>
                <tr>
                    <td><label for="email">Email address:</label></td>
                    <td><input type="text" id="email" name="email"></td>
                </tr>
                <tr>
                    <td>User's interest:</td>
                    <td>
                        <input type="checkbox" id="research" name="interest" value="research">
                        <label for="research">Research</label>
                        <input type="checkbox" id="purchase" name="interest" value="purchase">
                        <label for="purchase">Purchase</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="occupation">Occupation:</label></td>
                    <td>
                        <select id="occupation" name="occupation">
                            <option value="" selected>(select one)</option>
                            <option value="student">Student</option>
                            <option value="employed">Employed</option>
                            <option value="other">Other</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Want us to send you junk emails?</td>
                    <td>
                        <input type="radio" id="absolutely" name="junk_email" value="absolutely">
                        <label for="absolutely">absolutely</label>
                        <input type="radio" id="noway" name="junk_email" value="no way man">
                        <label for="noway">no way man</label>
                    </td>
                </tr>
                <tr>
                    <td><input type="submit" value="Submit"></td>
                    <td><input type="reset" value="Reset"></td>
                </tr>
            </table>
        </form>
    </div>

    <br>
    <hr style="border: 2px solid #ccc;">
    <br>

    <!-- Second Form Container -->
    <div id="registration-form-section">
        <center>
            <h2>Online Registration Form</h2>
            <form>
                <table cellpadding="6">
                    <tr>
                        <td><label for="username">Username:</label></td>
                        <td><input type="text" id="username" name="username"></td>
                    </tr>
                    <tr>
                        <td><label for="password">Password:</label></td>
                        <td><input type="password" id="password" name="password"></td>
                    </tr>
                    <tr>
                        <td><label for="confirm_password">Confirm password:</label></td>
                        <td><input type="password" id="confirm_password" name="confirm_password"></td>
                    </tr>
                    <tr>
                        <td><label for="name">Name:</label></td>
                        <td><input type="text" id="name" name="name"></td>
                    </tr>
                    <tr>
                        <td>Gender:</td>
                        <td>
                            <input type="radio" id="male" name="gender" value="male">
                            <label for="male">Male</label>
                            <input type="radio" id="female" name="gender" value="female">
                            <label for="female">Female</label>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="address">Address:</label></td>
                        <td>
                            <textarea id="address" name="address" rows="4" cols="22"></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="profession">Profession:</label></td>
                        <td>
                            <select id="profession" name="profession">
                                <option value="">(Select Profession)</option>
                                <option value="student">Student</option>
                                <option value="engineer">Engineer</option>
                                <option value="doctor">Doctor</option>
                                <option value="teacher">Teacher</option>
                                <option value="other">Other</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <br>
                            <input type="submit" value="Submit">
                            <input type="reset" value="Reset">
                        </td>
                    </tr>
                </table>
            </form>
        </center>
    </div>

</body>
</html>
