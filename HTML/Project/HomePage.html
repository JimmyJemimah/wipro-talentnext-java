<!DOCTYPE html>
<html>
<head>
    <title>Home Page</title>
</head>
<frameset rows="20%, 75%, 5%" frameborder="1">
    <!-- Top Row: Logo & Header -->
    <frameset cols="15%, 85%">
        <frame src="logo.html" name="logoFrame" scrolling="no" noresize>
        <frame src="header.html" name="headerFrame" scrolling="no" noresize>
    </frameset>

    <!-- Middle Row: Menu & Login Content -->
    <frameset cols="15%, 85%">
        <frame src="menu.html" name="menuFrame">
        <frame src="login.html" name="mainFrame">
    </frameset>

    <!-- Bottom Row: Footer -->
    <frame src="footer.html" name="footerFrame" scrolling="no" noresize>
</frameset>
</html>
