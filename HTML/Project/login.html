<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #d9d9d9;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }
        h2 {
            color: #00008b;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        table {
            margin: 0 auto;
            background-color: #008080;
            border: 3px solid #808080;
            padding: 10px;
        }
        td {
            padding: 8px 12px;
            color: #000000;
            font-weight: bold;
            font-size: 14px;
            text-align: left;
        }
        input[type="text"], input[type="password"] {
            width: 140px;
            padding: 3px;
        }
        input[type="submit"] {
            padding: 2px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Account Login</h2>
    <form action="#" method="post">
        <table>
            <tr>
                <td>User Name:</td>
                <td><input type="text" name="username" maxlength="8" size="8" required></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td><input type="password" name="password" maxlength="8" size="8" required></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="Login"></td>
            </tr>
        </table>
    </form>
</body>
</html>
