<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 7 - Text Formatting</title>
    <style>
        .styled-div {
            color: magenta;
            text-align: right;
            text-decoration: underline;
            text-transform: uppercase;
            text-indent: 60px;
        }
    </style>
</head>
<body>

    <div class="styled-div">
        This is a div element formatted with text properties including color, right alignment, underline, uppercase transformation, and 60px text indent.
    </div>

</body>
</html>
