<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 9 - Dynamic Clock</title>
</head>
<body onload="updateClock()">

    <h2>Current Time</h2>
    <input type="text" id="timeBox" readonly style="font-size: 20px; text-align: center; width: 150px;">

    <script>
        function updateClock() {
            let date = new Date();
            let hours = String(date.getHours()).padStart(2, '0');
            let minutes = String(date.getMinutes()).padStart(2, '0');
            let seconds = String(date.getSeconds()).padStart(2, '0');

            document.getElementById("timeBox").value = hours + ":" + minutes + ":" + seconds;

            // Refresh time every 1 second using setTimeout
            setTimeout(updateClock, 1000);
        }
    </script>

</body>
</html>
