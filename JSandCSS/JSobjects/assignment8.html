<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 8 - Odd or Even</title>
</head>
<body>

    <script>
        let input = prompt("Enter a number:");

        if (input !== null && input.trim() !== "" && !isNaN(input)) {
            let num = parseInt(input, 10);
            if (num % 2 === 0) {
                alert(num + " is EVEN.");
            } else {
                alert(num + " is ODD.");
            }
        } else {
            alert("Please enter a valid numeric value.");
        }
    </script>

</body>
</html>
