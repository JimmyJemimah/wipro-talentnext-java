    <title>Assignment 2 - Uppercase String</title>

<body>

    <script>
        let text = "hello world";
        let upperText = text.toUpperCase();
        
        document.write("Original: " + text + "<br>");
        document.write("Uppercase: " + upperText);
    </script>
