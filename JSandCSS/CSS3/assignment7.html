<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 7 - 2D Scaling</title>
    <style>
        .scaled-div {
            width: 100px;
            height: 50px;
            background-color: lightgreen;
            border: 1px solid darkgreen;
            margin: 100px auto;
            text-align: center;
            line-height: 50px;
            /* Scale width 2x, height 3x */
            transform: scale(2, 3);
        }
    </style>
</head>
<body>

    <div class="scaled-div">
        Scaled Div
    </div>

</body>
</html>
