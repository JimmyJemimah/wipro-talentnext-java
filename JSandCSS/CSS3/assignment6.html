<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 6 - Counter-Clockwise Rotation</title>
    <style>
        .rotated-div {
            width: 200px;
            height: 100px;
            background-color: #e0f7fa;
            border: 2px solid #006064;
            padding: 10px;
            margin: 60px;
            /* Counter-clockwise rotation of 20 degrees */
            transform: rotate(-20deg);
        }
    </style>
</head>
<body>

    <div class="rotated-div">
        This div element is rotated counter-clockwise by 20 degrees.
    </div>

</body>
</html>
