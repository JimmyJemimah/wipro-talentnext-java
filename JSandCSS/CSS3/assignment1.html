<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 1 - Border Radius</title>
    <style>
        div {
            border: 2px solid black;
            padding: 20px;
            background-color: #dddddd;
            border-top-left-radius: 2em;
        }
    </style>
</head>
<body>

    <div>
        This div element has a 2px solid border, 20px padding, #dddddd background color, and a top-left border-radius of 2em.
    </div>

</body>
</html>
