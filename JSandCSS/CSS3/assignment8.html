<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 8 - Skew Transformation</title>
    <style>
        .skewed-div {
            width: 200px;
            height: 100px;
            background-color: yellow;
            border: 1px solid black;
            margin: 60px;
            padding: 10px;
            /* Skew 20 deg on X-axis, 10 deg on Y-axis */
            transform: skew(20deg, 10deg);
        }
    </style>
</head>
<body>

    <div class="skewed-div">
        This div is skewed 20 degrees on the X-axis and 10 degrees on the Y-axis.
    </div>

</body>
</html>
