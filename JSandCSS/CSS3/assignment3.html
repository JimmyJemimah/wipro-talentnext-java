<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 3 - White Text Black Shadow</title>
    <style>
        body {
            background-color: #222222; /* Dark background so white text is clear */
        }

        .shadow-text {
            color: white;
            text-shadow: 2px 2px 4px black;
            font-size: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="shadow-text">
        White text with a black text shadow.
    </div>

</body>
</html>
