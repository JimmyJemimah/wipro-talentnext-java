<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 2 - Text Shadow</title>
    <style>
        div {
            font-size: 28px;
            font-weight: bold;
            text-shadow: 5px 0px 2px #888888; /* h-shadow: 5px, v-shadow: 0px */
        }
    </style>
</head>
<body>

    <div>
        This text element displays a horizontal text shadow (h-shadow).
    </div>

</body>
</html>
