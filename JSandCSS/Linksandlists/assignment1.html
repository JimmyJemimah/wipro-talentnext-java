<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 1 - Link State Colors</title>
    <style>
        /* Unvisited link */
        a:link {
            color: #FF0000;
        }

        /* Visited link */
        a:visited {
            color: #FFFF00;
        }

        /* Mouse over link */
        a:hover {
            color: #FF00FF;
        }

        /* Selected (active) link */
        a:active {
            color: #0000FF;
        }
    </style>
</head>
<body>

    <h2>Link State Colors Test</h2>
    <a href="https://www.example.com">Click here to test link states</a>

</body>
</html>
