<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 3 - Link Background Colors</title>
    <style>
        /* Unvisited link background */
        a:link {
            background-color: #FF0000;
            color: white; /* Added for readability */
            padding: 5px;
        }

        /* Visited link background */
        a:visited {
            background-color: #FFFF00;
            color: black;
            padding: 5px;
        }

        /* Mouse over link background */
        a:hover {
            background-color: #FF00FF;
            color: white;
            padding: 5px;
        }

        /* Selected link background */
        a:active {
            background-color: #0000FF;
            color: white;
            padding: 5px;
        }
    </style>
</head>
<body>

    <h2>Link Background Colors Test</h2>
    <a href="https://www.google.com">Click to test link background states</a>

</body>
</html>
