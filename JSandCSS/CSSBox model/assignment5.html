<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Box Model Assignment 5 - Paragraph Padding</title>
    <style>
        p {
            background-color: #f5f5f5;
            border: 1px solid #ccc;
        }

        .p1 {
            padding-left: 3cm;
        }

        .p2 {
            padding-right: 50%;
        }

        .p3 {
            padding-bottom: 25%;
        }

        .p4 {
            padding-top: 25%;
        }
    </style>
</head>
<body>

    <p class="p1">
        First Paragraph: Left padding of 3cm.
    </p>

    <p class="p2">
        Second Paragraph: Right padding of 50%.
    </p>

    <p class="p3">
        Third Paragraph: Bottom padding of 25%.
    </p>

    <p class="p4">
        Fourth Paragraph: Top padding of 25%.
    </p>

</body>
</html>
