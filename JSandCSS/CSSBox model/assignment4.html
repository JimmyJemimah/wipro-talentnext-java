<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Box Model Assignment 4 - Paragraph Margins</title>
    <style>
        .p1 {
            margin-top: 3cm;
            margin-bottom: 5cm;
            background-color: #ffe6e6;
        }

        .p2 {
            margin-left: 2cm;
            background-color: #e6ffe6;
        }

        .p3 {
            margin-top: 25%;
            background-color: #e6e6ff;
        }
    </style>
</head>
<body>

    <p class="p1">
        First Paragraph: Top margin is 3cm, Bottom margin is 5cm.
    </p>

    <p class="p2">
        Second Paragraph: Left margin is 2cm.
    </p>

    <p class="p3">
        Third Paragraph: Top margin is 25%.
    </p>

</body>
</html>
