<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlineRead</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .btn-dark-blue { background-color: #00008b; color: white; }
        .btn-brown { background-color: brown; color: white; }
    </style>
</head>
<body class="p-4">
    <h2>OnlineRead</h2>

    <!-- Book Types Section -->
    <div class="mb-4">
        <button class="btn btn-light border me-1">For All</button>
        <button class="btn btn-dark-blue me-1">Kids</button>
        <button class="btn btn-success me-1">Teens</button>
        <button class="btn btn-info text-white me-1">Scientific</button>
        <button class="btn btn-warning text-white me-1">Crime</button>
        <button class="btn btn-danger me-1">Horror</button>
        <button class="btn btn-brown me-1">Feedback</button>
    </div>

    <!-- Font Size Comfort Section (4 Steps) -->
    <div>
        <p class="mb-2"><strong>Comfort Font Size:</strong></p>
        <button class="btn btn-primary btn-lg fs-3 me-1">Extra Large</button>
        <button class="btn btn-primary btn-lg me-1">Large</button>
        <button class="btn btn-primary me-1">Medium</button>
        <button class="btn btn-primary btn-sm me-1">Small</button>
    </div>
</body>
</html>
