<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3 - Food Calories</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
    <h2>Food Contents and Calories</h2>
    <table class="table table-striped table-bordered w-50 mt-3">
        <thead>
            <tr>
                <th>Food Item</th>
                <th>Calories</th>
            </tr>
        </thead>
        <tbody>
            <!-- <=300: Light Green -->
            <tr class="table-success">
                <td>Apple</td>
                <td>95</td>
            </tr>
            <!-- 301 to 700: Light Blue -->
            <tr class="table-info">
                <td>Chicken Sandwich</td>
                <td>450</td>
            </tr>
            <!-- 700 to 1200: Light Orange -->
            <tr class="table-warning">
                <td>Cheese Pizza</td>
                <td>850</td>
            </tr>
            <!-- >1200: Light Red -->
            <tr class="table-danger">
                <td>Combo Feast Meal</td>
                <td>1400</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
