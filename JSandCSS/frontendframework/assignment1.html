<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 1 - Responsive Images</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
    <h2>Responsive Images on Screen Resize</h2>

    <!-- Visible on Extra Small (< 576px) -->
    <div class="d-block d-sm-none">
        <p><strong>Image 1 (Extra Small Screen)</strong></p>
        <img src="img1.jpg" alt="img1" class="img-fluid">
    </div>

    <!-- Visible on Small (>= 576px and < 768px) -->
    <div class="d-none d-sm-block d-md-none">
        <p><strong>Image 2 (Small Screen)</strong></p>
        <img src="img2.jpg" alt="img2" class="img-fluid">
    </div>

    <!-- Visible on Medium (>= 768px and < 992px) -->
    <div class="d-none d-md-block d-lg-none">
        <p><strong>Image 3 (Medium Screen)</strong></p>
        <img src="img3.jpg" alt="img3" class="img-fluid">
    </div>

    <!-- Visible on Large & Up (>= 992px) -->
    <div class="d-none d-lg-block">
        <p><strong>Image 4 (Large Screen)</strong></p>
        <img src="img4.jpg" alt="img4" class="img-fluid">
    </div>
</body>
</html>
